# Form section and field definitions for the admin TEI XML builder.
#
# Each section groups related fields. Fields can be:
#   applies_to: all       — always visible
#   applies_to: [type...] — only visible for specific charter types
#
# Field properties:
#   id                    — machine name (used as key in form data JSON)
#   label                 — display label in the form
#   input                 — input type: text, textarea, date, select, dynamic-list, radio
#   cardinality           — single | multiple
#   tei_element           — TEI element name to create
#   tei_attributes        — (optional) attributes on the TEI element
#   tei_wrapper           — (optional) intermediate wrapping element
#   tei_wrapper_attributes — (optional) attributes on the wrapper element
#   xpath_parent          — full XPath to the parent element where this field's TEI element lives
#   applies_to            — all | [type_id, ...]
#   required              — (optional) whether the field is required
#   options               — (select/radio fields only) list of {value, label} pairs
#   field_pair            — (optional) groups adjacent fields into a visual pair
#   exclusive_option      — (optional) config for per-entry radio on dynamic lists

types:
  - id: instrumentum_venditionis
    label: Instrumentum venditionis
