# Corpus table column definitions for CEI2TEI P5 documents.
#
# Each column requires: id, label, xpath
# Optional: sortable (default: true), filterable (default: true),
#           cardinality (default: single), join (default: ", "),
#           truncateWords (max words before ellipsis, default: no truncation)
#
# To add a column, add a new entry here. No code changes needed.
# To reorder columns, reorder this list. The table renders in this order.
# To hide a column, remove it from this list.

columns:
  - id: title
    label: Title
    xpath: tei:teiHeader/tei:fileDesc/tei:titleStmt/tei:title
    sortable: true
    filterable: true

  - id: signer
    label: Signer
    xpath: tei:teiHeader/tei:fileDesc/tei:titleStmt/tei:author
    sortable: true
    filterable: true

  - id: recipient
    label: Recipient
    xpath: tei:teiHeader/tei:fileDesc/tei:sourceDesc/tei:msDesc/tei:msContents/tei:msItem/tei:recipient
    sortable: true
    filterable: true

  - id: dating_chronological
    label: Dating (Chronological)
    xpath: tei:teiHeader/tei:profileDesc/tei:creation/tei:date
    sortable: true
    filterable: true

  - id: dating_topical
    label: Dating (Topical)
    xpath: tei:teiHeader/tei:profileDesc/tei:creation/tei:origPlace
    sortable: true
    filterable: true

  - id: object
    label: Object
    xpath: tei:teiHeader/tei:profileDesc/tei:textClass/tei:keywords/tei:term[@type='object']
    sortable: true
    filterable: true

  - id: object_subtype
    label: Object Subtype
    xpath: tei:teiHeader/tei:profileDesc/tei:textClass/tei:keywords/tei:term[@type='object_subtype']
    sortable: true
    filterable: true

  - id: language
    label: Language
    xpath: tei:teiHeader/tei:profileDesc/tei:langUsage/tei:language
    sortable: true
    filterable: true

  - id: material
    label: Material
    xpath: tei:teiHeader/tei:profileDesc/tei:textClass/tei:keywords/tei:term[@type='material']
    sortable: true
    filterable: true

  - id: notary
    label: Notary
    xpath: tei:teiHeader/tei:fileDesc/tei:sourceDesc/tei:msDesc/tei:msContents/tei:msItem/tei:respStmt/tei:name
    sortable: true
    filterable: true

  - id: witnesses
    label: Witnesses
    xpath: tei:text/tei:body/tei:listWitness/tei:witness/tei:name
    sortable: false
    filterable: true
    cardinality: multiple
    join: "; "

  - id: price_clause
    label: Price Clause
    xpath: tei:text/tei:body/tei:div[@type='price_clause']
    sortable: false
    filterable: true
    truncateWords: 15

  - id: penalty_clause
    label: Penalty Clause
    xpath: tei:text/tei:body/tei:div[@type='penalty_clause']
    sortable: false
    filterable: true
    truncateWords: 15

  - id: archive
    label: Archive
    xpath: tei:teiHeader/tei:fileDesc/tei:sourceDesc/tei:msDesc/tei:msIdentifier/tei:repository
    sortable: true
    filterable: true

  - id: shelfmark
    label: Shelfmark
    xpath: tei:teiHeader/tei:fileDesc/tei:sourceDesc/tei:msDesc/tei:msIdentifier/tei:idno
    sortable: true
    filterable: true
