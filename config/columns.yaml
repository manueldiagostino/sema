# ══════════════════════════════════════════════════════════════════════════════
# DEPRECATED — This file is no longer used at build time.
#
# build-corpus.ts now uses the schema adapter (config/tei-schema/_base.yaml
# + config/views/table-home.yaml) to dynamically generate column XPaths.
# The XPaths in this file are STALE and reference old CEI2TEI element names
# (diploPart, listWitness, witness, etc.).
#
# DO NOT EDIT. For column changes, edit:
#   - config/tei-schema/_base.yaml      (element definitions, XPath parents)
#   - config/views/table-home.yaml      (visibility, order, width, render)
# ══════════════════════════════════════════════════════════════════════════════
#
# Corpus table column definitions for CEI2TEI P5 documents.
#
# Each column requires: id, label, xpath
# Optional: sortable (default: true), filterable (default: true),
#           cardinality (default: single), join (default: ", "),
#           truncateWords (max words before ellipsis, default: no truncation)
#
# To add a column, add a new entry here. No code changes needed.
# To reorder columns, reorder this list. The table renders in this order.
# To hide a column, remove it from this list.

columns:
  - id: full_text
    label: Full Text
    xpath: tei:text/tei:body/tei:diploPart[@type='full_text']
    sortable: false
    filterable: false

  - id: intitulatio_analysis
    label: Auctor
    xpath: tei:teiHeader/tei:profileDesc/tei:textClass/tei:keywords/tei:term[@type='intitulatio_analysis']
    sortable: true
    filterable: true

  - id: inscriptio_analysis
    label: Destinatarius
    xpath: tei:teiHeader/tei:profileDesc/tei:textClass/tei:keywords/tei:term[@type='inscriptio_analysis']
    sortable: true
    filterable: true

  - id: pretium
    label: Price
    xpath: tei:teiHeader/tei:profileDesc/tei:textClass/tei:keywords/tei:term[@type='price']
    sortable: true
    filterable: true

  - id: property_location
    label: Property Location
    xpath: tei:teiHeader/tei:profileDesc/tei:textClass/tei:keywords/tei:term[@type='property_location']
    sortable: true
    filterable: true

  - id: datatio_topica_analysis
    label: Datatio topica
    xpath: tei:teiHeader/tei:profileDesc/tei:creation/tei:term[@type='datatio_topica_analysis']
    sortable: true
    filterable: true

  - id: datatio_topica_text
    label: Datatio topica
    xpath: tei:text/tei:body/tei:div[@type='eschatocol']/tei:diploPart[@type='datatio']
    sortable: false
    filterable: false
    truncateWords: 20

  - id: dating_chronological
    label: Datatio Chronica
    xpath: tei:teiHeader/tei:profileDesc/tei:creation/tei:date
    attribute: when
    sortable: true
    filterable: true

  - id: dating_topical
    label: Datatio Topica
    xpath: tei:teiHeader/tei:profileDesc/tei:creation/tei:term[@type='datatio_topica_analysis']
    sortable: true
    filterable: true

  - id: completio_analysis
    label: Notary
    xpath: tei:teiHeader/tei:fileDesc/tei:sourceDesc/tei:msDesc/tei:msContents/tei:msItem/tei:respStmt/tei:name
    sortable: true
    filterable: true

  - id: testes_names
    label: Testes
    xpath: tei:text/tei:body/tei:div[@type='eschatocol']/tei:div[@type='subscriptio']/tei:listWitness/tei:witness/tei:name
    sortable: false
    filterable: true
    cardinality: multiple
    join: "; "

  - id: investitor_name
    label: Investitor
    xpath: tei:text/tei:body/tei:div[@type='eschatocol']/tei:div[@type='subscriptio']/tei:listWitness/tei:witness[@ana='#investitor']/tei:name
    sortable: false
    filterable: true
    cardinality: single

  - id: repository
    label: Archive
    xpath: tei:teiHeader/tei:fileDesc/tei:sourceDesc/tei:msDesc/tei:msIdentifier/tei:repository
    sortable: true
    filterable: true

  - id: shelfmark
    label: Shelfmark
    xpath: tei:teiHeader/tei:fileDesc/tei:sourceDesc/tei:msDesc/tei:msIdentifier/tei:idno
    sortable: true
    filterable: true

  - id: invocatio_analysis
    label: Invocatio Analysis
    xpath: tei:text/tei:body/tei:div[@type='protocol']/tei:diploPart[@type='invocatio']
    attribute: subtype
    sortable: false
    filterable: false

  - id: descriptio_rei_analysis
    label: Descriptio Rei Analysis
    xpath: tei:text/tei:body/tei:div[@type='contextus']/tei:diploPart[@type='dispositio' and @subtype]
    attribute: subtype
    sortable: false
    filterable: false

  - id: sanctio_analysis
    label: Sanctio Analysis
    xpath: tei:text/tei:body/tei:div[@type='contextus']/tei:diploPart[@type='sanctio']
    attribute: subtype
    sortable: false
    filterable: false

  - id: subscriptio_emittentis_analysis
    label: Subscriptio Emittentis Analysis
    xpath: tei:teiHeader/tei:profileDesc/tei:textClass/tei:keywords/tei:term[@type='subscriptio_emittentis_analysis']
    sortable: false
    filterable: false

  - id: subscriptiones_testium_text
    label: Subscriptiones testium
    xpath: tei:text/tei:body/tei:div[@type='eschatocol']/tei:div[@type='subscriptio']/tei:diploPart[@type='subscriptio' and @subtype='testium']
    sortable: false
    filterable: false
    truncateWords: 20

  - id: subscriptio_emittentis_text
    label: Subscriptio emittentis
    xpath: tei:text/tei:body/tei:div[@type='eschatocol']/tei:div[@type='subscriptio']/tei:diploPart[@type='subscriptio']/tei:name
    sortable: false
    filterable: false

  # --- Body-text columns (diplomatic clauses) ---
  # These extract text from <body> divisions.
  # truncateWords limits table display; full text shown in View modal.

  - id: invocatio_text
    label: Invocatio
    xpath: tei:text/tei:body/tei:div[@type='protocol']/tei:diploPart[@type='invocatio']
    sortable: false
    filterable: false
    truncateWords: 20

  - id: datatio_chronica_text
    label: Datatio Chronica
    xpath: tei:text/tei:body/tei:div[@type='protocol']/tei:diploPart[@type='datatio']
    sortable: false
    filterable: false
    truncateWords: 20

  - id: intitulatio_text
    label: Auctor
    xpath: tei:text/tei:body/tei:div[@type='contextus']/tei:diploPart[@type='intitulatio']
    sortable: false
    filterable: false
    truncateWords: 20

  - id: dispositio_text
    label: Verba dispositiva
    xpath: tei:text/tei:body/tei:div[@type='contextus']/tei:diploPart[@type='dispositio']
