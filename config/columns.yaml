# Corpus table column definitions for CEI2TEI P5 documents.
#
# Each column requires: id, label, xpath
# Optional: sortable (default: true), filterable (default: true),
#           cardinality (default: single), join (default: ", "),
#           truncateWords (max words before ellipsis, default: no truncation)
#
# To add a column, add a new entry here. No code changes needed.
# To reorder columns, reorder this list. The table renders in this order.
# To hide a column, remove it from this list.

columns:
  - id: author_name
    label: Author
    xpath: tei:teiHeader/tei:profileDesc/tei:textClass/tei:keywords/tei:term[@type='author_name']
    sortable: true
    filterable: true

  - id: recipient_name
    label: Recipient
    xpath: tei:teiHeader/tei:profileDesc/tei:textClass/tei:keywords/tei:term[@type='recipient_name']
    sortable: true
    filterable: true

  - id: dating_chronological
    label: Dating (Chronological)
    xpath: tei:teiHeader/tei:profileDesc/tei:creation/tei:date
    sortable: true
    filterable: true

  - id: dating_topical
    label: Dating (Topical)
    xpath: tei:teiHeader/tei:profileDesc/tei:creation/tei:origPlace
    sortable: true
    filterable: true

  - id: pretium
    label: Price
    xpath: tei:teiHeader/tei:profileDesc/tei:textClass/tei:keywords/tei:term[@type='price']
    sortable: true
    filterable: true

  - id: property_location
    label: Property Location
    xpath: tei:teiHeader/tei:profileDesc/tei:textClass/tei:keywords/tei:term[@type='property_location']
    sortable: true
    filterable: true

  - id: locus_redactionis
    label: Place of Redaction
    xpath: tei:teiHeader/tei:profileDesc/tei:textClass/tei:keywords/tei:term[@type='locus_redactionis']
    sortable: true
    filterable: true

  - id: notarius
    label: Notary
    xpath: tei:teiHeader/tei:fileDesc/tei:sourceDesc/tei:msDesc/tei:msContents/tei:msItem/tei:respStmt/tei:name
    sortable: true
    filterable: true

  - id: testes_names
    label: Witnesses
    xpath: tei:text/tei:body/tei:div[@type='eschatocol']/tei:div[@type='subscriptiones']/tei:listWitness/tei:witness/tei:name
    sortable: false
    filterable: true
    cardinality: multiple
    join: "; "

  - id: repository
    label: Archive
    xpath: tei:teiHeader/tei:fileDesc/tei:sourceDesc/tei:msDesc/tei:msIdentifier/tei:repository
    sortable: true
    filterable: true

  - id: shelfmark
    label: Shelfmark
    xpath: tei:teiHeader/tei:fileDesc/tei:sourceDesc/tei:msDesc/tei:msIdentifier/tei:idno
    sortable: true
    filterable: true
