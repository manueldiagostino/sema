  - id: translationis_iuris_text
    label: Formula translationis iuris
    xpath: tei:text/tei:body/tei:div[@type='contextus']/tei:diploPart[@type='clausulae' and @subtype='translationis_iuris']
    sortable: false
    filterable: false
    truncateWords: 20

  - id: liberi_gaudii_text
    label: Formula liberi gaudii
    xpath: tei:text/tei:body/tei:div[@type='contextus']/tei:diploPart[@type='clausulae' and @subtype='liberi_gaudii']
    sortable: false
    filterable: false
    truncateWords: 20

  - id: legitimae_defensionis_text
    label: Formula legitimae defensionis
    xpath: tei:text/tei:body/tei:div[@type='contextus']/tei:diploPart[@type='clausulae' and @subtype='legitimae_defensionis']
